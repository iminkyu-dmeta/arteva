---

- name: Create backup directory 
  become: True
  file:
    path: "{{ apps_dir }}/PKG/{{ pkg_dir }}/backup"
    state: directory 
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"

- name: backup cockpit rocky
  become: True
  copy:
    src: /usr/share/cockpit/branding/rocky
    dest: "{{ apps_dir }}/PKG/{{ pkg_dir }}/backup/"
    remote_src: yes

- name: update tomcat.service
  become: True
  copy:
    src: /usr/lib/systemd/system/tomcat.service 
    dest: "{{ apps_dir }}/PKG/{{ pkg_dir }}/backup/"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    remote_src: yes
    mode: 0644
