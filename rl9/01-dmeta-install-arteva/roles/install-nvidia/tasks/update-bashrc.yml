---

- name: update bashrc
  become: True
  template:
    src: bashrc.j2
    dest: "/home/{{ user }}/.bashrc"

- name: bashrc 
  become: True
  become_user: "{{ user }}"
  become_flags: "-i"
  shell: source ~/.bashrc

