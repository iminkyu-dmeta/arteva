---

- name: check that file exist
  stat:
    path: /etc/ssh/{{ item }}
  with_items:
    - "sshd_config"
  no_log: True
  register: system

- name: Copy file original config
  become: True
  copy:
    src: /etc/ssh/{{ item.item }}
    dest: /etc/ssh/{{ item.item }}.orig
    remote_src: yes
  with_items: "{{ system.results }}"
  when: item.stat.exists

- name: Set sshd Config
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'

- name: Restart sshd
  become: True
  systemd:
    state: restarted
    name: sshd
