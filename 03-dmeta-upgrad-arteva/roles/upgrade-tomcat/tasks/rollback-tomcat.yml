- name: remove tomcat dir
  become: true
  file:
    path: "{{ tomcat_home }}"
    state: absent

- name: create tomcat directory
  become: True
  file:
    path: "{{ apps_dir }}/tomcat"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    state: directory

- name: move tomcat
  become: True
  copy:
    src: "{{ apps_dir }}/{{ old_tomcat_ver }}/"
    dest: "{{ apps_dir }}/tomcat"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    remote_src: yes

- name: delete
  become: True
  file:
    path: "{{ apps_dir }}/{{ old_tomcat_ver }}"
    state: absent
