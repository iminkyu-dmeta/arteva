---

- name: upload server.xml
  become: True
  vars:
    ipaddress: "{{ ansible_host }}"
  template:
    src: server.xml.j2
    dest: "{{ apps_dir }}/tomcat/conf/{{ item }}"
  with_items:
    - "server.xml"

- name: upload context.xml
  become: True
  template:
    src: context.xml.j2
    dest: "{{ apps_dir }}/tomcat/conf/{{ item }}"
  with_items:
    - "context.xml"

- name: upload web.xml
  become: True
  template:
    src: web.xml.j2
    dest: "{{ apps_dir }}/tomcat/conf/{{ item }}"
  with_items:
    - "web.xml"

- name: chown tomcat
  become: True
  file:
    path: "{{ apps_dir }}/tomcat"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    state: directory
    recurse: yes

- name: systemd reread
  become: True
  systemd:
    daemon_reload: yes

- name: systemd enable tomcat
  become: True
  systemd:
    name: tomcat
    state: started
    enabled: yes

- name: config firewall port
  become: True
  firewalld:
    port: "{{ item }}"
    permanent: True
    state: enabled
  with_items:
    - '{{ was_port }}'

- name: reload firewalld
  become: True
  command: firewall-cmd --reload
