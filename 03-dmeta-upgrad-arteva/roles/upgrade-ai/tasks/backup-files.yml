---

- name: create Backup directory
  become: True
  file:
    path: "{{ apps_dir }}/AI-Engine/Backup"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    state: directory
      
- name: backup ai_process files
  become: True
  copy:
    src: "{{ apps_dir }}/arteva/ai_engine/{{ item.src }}"
    dest: "{{ apps_dir }}/AI-Engine/Backup/{{ item.dest }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    remote_src: yes
  with_items:
    - { src: 'ai_process/camera_thread.py', dest: 'camera_thread.py' }
    - { src: 'common/utils/rtsp_capture.py', dest: 'rtsp_capture.py' }
    #- { src: 'httpauth.c', dest: 'ai_process/httpauth.c' }
    #- { src: 'normal_event_set.py', dest: 'ai_process/event_sets/normal_event_set.py' }
    #- { src: 'normal_event.py', dest: 'ai_process/events/normal_event.py' }
    #- { src: 'yolov8_nano_l4_fp16_train18_8522_v3.engine', dest: 'ai_process/model/weights/v3/detect/yolov8_nano_l4_fp16_train18_8522_v3.engine' }

- name: backup ffmpeg lib
  become: True
  copy:
    src: "{{ apps_dir }}/arteva/ai_engine/{{ lib_dir }}/{{ item.src }}"
    dest: "{{ apps_dir }}/AI-Engine/Backup/"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    remote_src: yes
  with_items:
    - { src: 'libavcodec-9aae324f.so.59.37.100', dest: 'libavcodec-9aae324f.so.59.37.100' }
    - { src: 'libavformat-3ff1be5b.so.59.27.100', dest: 'libavformat-3ff1be5b.so.59.27.100' }
    - { src: 'libavutil-a0a0531e.so.57.28.100', dest: 'libavutil-a0a0531e.so.57.28.100' }
    - { src: 'libswscale-2c3c8be7.so.6.7.100', dest: 'libswscale-2c3c8be7.so.6.7.100' }
    - { src: 'libswresample-2ec4394e.so.4.7.100', dest: 'libswresample-2ec4394e.so.4.7.100' }
