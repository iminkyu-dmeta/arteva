---

- name: delete new files 
  become: True
  file:
    path: "{{ apps_dir }}/arteva/ai_engine/{{ item }}"
    state: absent
  with_items:
    - 'ai_process/httpauth.c'
    - 'ai_process/event_sets/normal_event_set.py'
    - 'ai_process/events/normal_event.py'
    - 'ai_process/model/weights/v3/detect/yolov8_nano_l4_fp16_train18_8522_v3.engine'
    - 'ai_process/camera_thread.py'
    - 'common/utils/rtsp_capture.py'

- name: delete new files
  become: True
  file:
    path: "{{ apps_dir }}/arteva/ai_engine/{{ lib_dir }}/{{ item }}"
    state: absent
  with_items:
    - 'libavcodec.so.59'
    - 'libavformat.so.59'
    - 'libavutil.so.57'
    - 'libswscale.so.6'
    - 'libswresample.so.4'
    - 'libavcodec-9aae324f.so.59.37.100'
    - 'libavformat-3ff1be5b.so.59.27.100'
    - 'libavutil-a0a0531e.so.57.28.100'
    - 'libswscale-2c3c8be7.so.6.7.100'
    - 'libswresample-2ec4394e.so.4.7.100'

- name: rollback files
  become: True
  copy:
    src: "{{ apps_dir }}/AI-Engine/Backup/{{ item.src }}"
    dest: "{{ apps_dir }}/arteva/ai_engine/{{ item.dest }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    remote_src: yes
  with_items:
    - { src: 'camera_thread.py', dest: 'ai_process/camera_thread.py' }
    - { src: 'rtsp_capture.py', dest: 'common/utils/rtsp_capture.py' }

- name: rollback ffmpeg lib
  become: True
  copy:
    src: "{{ apps_dir }}/AI-Engine/Backup/{{ item.src }}"
    dest: "{{ apps_dir }}/arteva/ai_engine/{{ lib_dir }}/{{ item.dest }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: "0775"
    remote_src: yes
  with_items:
    - { src: 'libavcodec-9aae324f.so.59.37.100', dest: 'libavcodec-9aae324f.so.59.37.100' }
    - { src: 'libavformat-3ff1be5b.so.59.27.100', dest: 'libavformat-3ff1be5b.so.59.27.100' }
    - { src: 'libavutil-a0a0531e.so.57.28.100', dest: 'libavutil-a0a0531e.so.57.28.100' }
    - { src: 'libswscale-2c3c8be7.so.6.7.100', dest: 'libswscale-2c3c8be7.so.6.7.100' }
    - { src: 'libswresample-2ec4394e.so.4.7.100', dest: 'libswresample-2ec4394e.so.4.7.100' }
