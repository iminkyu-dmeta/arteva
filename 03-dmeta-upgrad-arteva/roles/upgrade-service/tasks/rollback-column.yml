---

- name: upload sql files
  become: True
  copy:
    src: "{{ def_dir }}/{{ item }}"
    dest: "{{ tmp_dir }}"
  when: sql_file is defined
  with_items:
    - "{{ sql_file }}"

- name: alter table
  become: True
  mysql_db:
    name: "{{ database }}"
    state: import
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
    target: "{{ tmp_dir }}/{{ sql_file }}"
  when: sql_file is defined

- name: upload sql files
  become: True
  copy:
    src: "{{ def_dir }}/{{ item }}"
    dest: "{{ tmp_dir }}"
  when: sql_file is not defined
  with_items:
    - "{{ rollback_sql }}"

- name: alter table
  become: True
  mysql_db:
    name: "{{ database }}"
    state: import
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
    target: "{{ tmp_dir }}/{{ rollback_sql }}"
  when: sql_file is not defined

