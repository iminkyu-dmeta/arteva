- name: delete upload file
  become: True
  file:
    path: "{{ tmp_dir }}/{{ sql_file }}"
    state: absent
  when: sql_file is defined

- name: delete upload file
  become: True
  file:
    path: "{{ tmp_dir }}/{{ rollback_sql }}"
    state: absent
  when: sql_file is not defined
