---

- name: U-37 crontab file permission 
  file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0600'
  with_items:
    - '/etc/crontab' 
    - '/etc/anacrontab'

- name: crontab file permission
  file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0640'
    state: touch
  with_items:
    - '/etc/cron.allow'
    - '/etc/at.allow'

- name: crontab file permission
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - '/etc/at.deny'
