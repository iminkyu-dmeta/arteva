- name: upload ai engine files
  unarchive:
    src: "{{ def_dir }}/{{ item }}"
    dest: "{{ apps_dir }}/arteva"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
  with_items:
    - "{{ ai_files }}"

- name: copy ai engine 
  become: True
  copy:
    src: "{{ apps_dir }}/arteva/{{ ai_ver }}/"
    dest: "{{ apps_dir }}/arteva/ai_engine"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    remote_src: yes

- name: delete upload file
  become: True
  file:
    path: "{{ apps_dir }}/arteva/{{ ai_ver }}/"
    state: absent

#- name: move directory 
#  become: True
#  shell: |
#    mv {{ apps_dir }}/arteva/{{ ai_ver }} {{ apps_dir }}/arteva/ai_engine

- name: create ai directory
  become: True
  file:
    path: "{{ apps_dir }}/arteva/ai_engine/ai"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
  
- name: upload arteva backend files
  unarchive:
    src: "{{ def_dir }}/{{ item }}"
    dest: "{{ apps_dir }}/arteva/ai_engine/ai"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
  with_items:
    - "{{ ai_env_files }}"

- name: untar dotenvx_file
  unarchive:
    src: "{{ apps_dir }}/arteva/ai_engine/{{ item }}"
    dest: "{{ apps_dir }}/arteva/ai_engine"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    remote_src: yes
  with_items:
    - "{{ dotenvx_file }}"

- name: move dotenvx
  become: True
  copy:
    src: "{{ apps_dir }}/arteva/ai_engine/{{ item }}"
    dest: "/usr/local/bin"
    mode: '0755'
    remote_src: yes
  with_items:
    - "dotenvx"

- name: soft link 
  become: True
  file:
    src: "{{ ai_env_path }}/{{ item.src }}"
    dest: "{{ ai_env_path }}/{{ item.dest }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    state: link
  with_items:
    - { src: 'libavcodec-9aae324f.so.59.37.100', dest: 'libavcodec.so.59' }
    - { src: 'libavformat-3ff1be5b.so.59.27.100', dest: 'libavformat.so.59' }
    - { src: 'libavutil-a0a0531e.so.57.28.100', dest: 'libavutil.so.57' }
    - { src: 'libswresample-2ec4394e.so.4.7.100', dest: 'libswresample.so.4' }
    - { src: 'libswscale-2c3c8be7.so.6.7.100', dest: 'libswscale.so.6' }

