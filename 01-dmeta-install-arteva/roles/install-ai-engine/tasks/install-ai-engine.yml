- name: update run arteva script 
  become: True
  lineinfile:
    path: '{{ apps_dir }}/arteva/ai_engine/run_arteva.sh'
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  with_items:
    - { regexp: '^source ', line: 'source /home/{{ tomcat_user }}/.bashrc' }

- name: update run arteva script 
  become: True
  replace:
    path: "{{ item }}"
    regexp: '/home/dmeta'
    replace: '{{ apps_dir }}'
  with_items:
    - '{{ apps_dir }}/arteva/ai_engine/run_arteva.sh'

- name: create nvidia-mps directory
  become: True
  file:
    path: "{{ tmp_dir }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
  with_items:
    - "nvidia-mps"
    - "nvidia-log"

- name: source profile
  become: True
  shell: |
    source /etc/profile
